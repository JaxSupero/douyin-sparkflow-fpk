name: Auto-update upstream

# 自动跟踪上游 douyin-sparkflow 的 main 分支并触发重建。
#
# 上游没有打 tag / 发 release（版本只记在 CHANGELOG 的日期条目里），
# 因此这里跟踪的是 **main 分支 HEAD 的 commit SHA**：
#   - 用 git ls-remote 拿 HEAD（单请求、无 API 限流、无需 token）
#   - 与 config/bootstrap/upstream.env 里的 UPSTREAM_SHA 比对
#   - 变化时更新固定 SHA 并递增 manifest patch 版本，然后 repository_dispatch 构建
#   - 无变化时完全不改文件，也不触发构建
#
# 频率：每天 3 次（UTC 01:17 / 09:17 / 17:17）。避开整点。

on:
  schedule:
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 必须全量历史：gen-changelog.py 要读「上次发布的提交 .. HEAD」
          # 之间的本仓库提交，归纳出打包侧改动。浅克隆（depth 1）下这段
          # git log 直接失败，changelog 会静默丢掉我们自己改的那部分。
          fetch-depth: 0

      - name: Detect latest upstream commit
        id: detect
        env:
          UPSTREAM_REPO: halfwaystudent/douyin-sparkflow
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${UPSTREAM_REPO}"
          LATEST_JSON=""; LATEST_SHA=""; LATEST_DATE=""
          # 必须带 token：匿名调 api.github.com 会被按 IP 限流成 403，
          # 本工作流曾连续失败在 4 个 "curl: (22) ... 403" 上。
          if LATEST_JSON="$(curl --retry 3 --retry-delay 5 --retry-all-errors -fsSL --max-time 60 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${API}/commits/main")"; then
            LATEST_SHA="$(printf '%s' "$LATEST_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
            LATEST_DATE="$(printf '%s' "$LATEST_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["committer"]["date"][:10])')"
          else
            # 兜底：git ls-remote 单请求、不受 API 限流；拿不到提交日期就记当天。
            echo "::warning:: GitHub API 不可用，回退 git ls-remote"
            LATEST_SHA="$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" refs/heads/main | awk '{print $1}')"
            LATEST_DATE="$(date -u +%F)"
          fi
          [[ "$LATEST_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error:: invalid upstream SHA"; exit 1; }
          PROBE="$(mktemp -d)"
          trap 'rm -rf "$PROBE"' EXIT
          git -C "$PROBE" init -q
          git -C "$PROBE" remote add origin "https://github.com/${UPSTREAM_REPO}.git"
          git -C "$PROBE" fetch -q --depth 1 origin "$LATEST_SHA"
          printf 'sha=%s\ndate=%s\n' "$LATEST_SHA" "$LATEST_DATE" >> "$GITHUB_OUTPUT"
          echo "upstream main: ${LATEST_SHA} (${LATEST_DATE})"

      - name: Compare and bump version
        id: bump
        run: |
          set -euo pipefail
          python3 scripts/update-upstream.py \
            "${{ steps.detect.outputs.sha }}" \
            "${{ steps.detect.outputs.date }}" \
            config/bootstrap/upstream.env manifest "$GITHUB_OUTPUT"

      - name: Generate Chinese user-facing changelog
        id: changelog
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 上一个版本的 pin 就是本次 changelog 的区间起点；首次更新无上一版，
          # 退化为「本次区间内全部提交」，由脚本自身按日期去重限流。
          PREV_SHA="$(python3 - <<'PY'
          import re, subprocess
          # update-upstream.py 刚把新 SHA 写进了 upstream.env，这里从 git 取旧值
          old = subprocess.run(["git", "show", "HEAD:config/bootstrap/upstream.env"],
                               capture_output=True, text=True, check=True).stdout
          m = re.search(r"^UPSTREAM_SHA=([0-9a-f]{40})$", old, re.M)
          print(m.group(1) if m else "")
          PY
          )"
          # 首次更新时 PREV_SHA 为空，gen-changelog.py 会自行退化为「上游最近 30 个提交」。
          echo "changelog 区间: ${PREV_SHA:-<首次>}..${{ steps.detect.outputs.sha }}"
          python3 scripts/gen-changelog.py \
            ${PREV_SHA:+--prev-sha "$PREV_SHA"} \
            --new-sha "${{ steps.detect.outputs.sha }}" \
            --manifest manifest \
            --out changelog.txt
          {
            echo "text<<CLGEOF"
            cat changelog.txt
            echo "CLGEOF"
          } >> "$GITHUB_OUTPUT"
          echo "已生成 changelog.txt: $(wc -m < changelog.txt) 字符"

      - name: Commit upstream pin, FPK version and changelog
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/bootstrap/upstream.env manifest changelog.txt
          git commit -m "chore: update upstream pin, bump FPK version and refresh changelog"
          git push

      - name: Dispatch FPK build
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          UPSTREAM_SHA: ${{ steps.detect.outputs.sha }}
          UPSTREAM_DATE: ${{ steps.detect.outputs.date }}
        run: |
          set -euo pipefail
          jq -n --arg sha "$UPSTREAM_SHA" --arg date "$UPSTREAM_DATE" \
            '{event_type:"upstream-updated",client_payload:{sha:$sha,date:$date}}' \
            | curl --retry 3 --retry-delay 5 --retry-all-errors -fsSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$GH_REPOSITORY/dispatches" \
              --data-binary @-
